<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header id="form-top">
        <nav>
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="form.html">Sign up</a>
                </li>
            </ul>
        </nav>
        <hgroup>
            <h2>Sign up</h2>
            <p>Create an account to get started on your learning journey</p>
        </hgroup>
    </header>
    <main>
        <form action="success.html">
            <div class="form-group">
                <label for="email">Email</label>
                <div>
                    <input type="email" id="email" name="email" required placeholder="john.doe@example.com" />
                    <p class="error-message" hidden aria-hidden><span class="visually-hidden">Error: </span>Please provide a valid email</p>
                </div>
            </div>

            <div class="form-group">
                <label for="firstname">First name</label>
                <div>
                    <input type="firstname" id="firstname" name="firstname" required placeholder="John" />
                    <p class="error-message" hidden aria-hidden><span class="visually-hidden">Error: </span>First name is required</p>
                </div>
            </div>

            <div class="form-group">
                <label for="lastname">Last name</label>
                <div>
                    <input type="lastname" id="lastname" name="lastname" required placeholder="Doe" />
                    <p class="error-message" hidden aria-hidden><span class="visually-hidden">Error: </span>Last name is required</p>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone number</label>
                <div>
                    <input type="phone" id="phone" name="phone" required placeholder="+1234567890" />
                    <p class="error-message" hidden aria-hidden><span class="visually-hidden">Error: </span>Phone number is required</p>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div>
                    <input type="password" id="password" name="password" required placeholder="********" />
                    <p class="error-message" hidden aria-hidden><span class="visually-hidden">Error: </span>Password must be at least 8 characters long</p>
                </div>
            </div>

            <!-- formmethod should be "post" but to achieve navigation to the success page i used "get" -->
            <button type="submit" formmethod="get">Proceed to dashboard &#10132;</button>   
        </form>
    </main>
</body>
</html>
